<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenCoverMaker</title>
    <!-- Google Fonts: Noto Sans SC (思源黑体), Noto Serif SC (思源宋体), ZCOOL QingKe HuangYou (站酷庆科黄油体), Long Cang (龙藏体), Ma Shan Zheng (马善政楷书), Zhi Mang Xing (志莽行书) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&family=Noto+Serif+SC:wght@400;700;900&family=ZCOOL+QingKe+HuangYou&family=Long+Cang&family=Ma+Shan+Zheng&family=Zhi+Mang+Xing&display=swap" rel="stylesheet">
    <!-- 霞鹜文楷 LXGW WenKai Screen -->
    <link rel="stylesheet" href="https://cdn.staticfile.org/lxgw-wenkai-screen-webfont/1.7.0/lxgwwenkaiscreen.css">
    <!-- 得意黑 Smiley Sans (@fontpkg CDN, woff2) -->
    <style>
      @font-face {
        font-family: 'Smiley Sans';
        font-weight: 400;
        font-display: swap;
        src: url('https://unpkg.com/@fontpkg/smiley-sans@2.0.4/SmileySans-Oblique.ttf.woff2') format('woff2');
      }
    </style>
    <!-- 阿里巴巴普惠体 (TTF-Min 精简版, 通用规范汉字表8105字) -->
    <style>
      @font-face {
        font-family: 'Alibaba PuHuiTi';
        font-weight: 300;
        font-display: swap;
        src: url('https://cdn.jsdelivr.net/gh/ZaneL1u/TTF-Min@main/dist/ttf+otf阿里巴巴普惠体/AlibabaPuHuiTi-3-45-Light.ttf') format('truetype');
      }
      @font-face {
        font-family: 'Alibaba PuHuiTi';
        font-weight: 400;
        font-display: swap;
        src: url('https://cdn.jsdelivr.net/gh/ZaneL1u/TTF-Min@main/dist/ttf+otf阿里巴巴普惠体/AlibabaPuHuiTi-3-55-Regular.ttf') format('truetype');
      }
      @font-face {
        font-family: 'Alibaba PuHuiTi';
        font-weight: 500;
        font-display: swap;
        src: url('https://cdn.jsdelivr.net/gh/ZaneL1u/TTF-Min@main/dist/ttf+otf阿里巴巴普惠体/AlibabaPuHuiTi-3-65-Medium.ttf') format('truetype');
      }
      @font-face {
        font-family: 'Alibaba PuHuiTi';
        font-weight: 700;
        font-display: swap;
        src: url('https://cdn.jsdelivr.net/gh/ZaneL1u/TTF-Min@main/dist/ttf+otf阿里巴巴普惠体/AlibabaPuHuiTi-3-85-Bold.ttf') format('truetype');
      }
      @font-face {
        font-family: 'Alibaba PuHuiTi';
        font-weight: 900;
        font-display: swap;
        src: url('https://cdn.jsdelivr.net/gh/ZaneL1u/TTF-Min@main/dist/ttf+otf阿里巴巴普惠体/AlibabaPuHuiTi-3-115-Black.ttf') format('truetype');
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
